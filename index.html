X.forEach((x,i)=>h+=`<div class="ex" onclick="sheet([${X.map((_,j)=>j)}],${i})"><div class="th" data-i="${i}"></div><div><b>${x.n}</b><small>${LN[LV[i]-1]}: ${x.m.join('، ')}</small></div></div>`);
a.innerHTML=h+'</div>';thumbs()}
function rDet(a){const w=V.f(),s=stats(w),Lv=lvl();
a.innerHTML=`<div class="wrap"><button class="back" onclick="go(V.back)">›</button><h1>${w.plan?'يوم '+ar(w.plan):w.t}</h1><p class="mu">${w.plan?w.t+': ':''}${w.d}</p>
<div class="grid3"><div class="st"><b>${ar(s.k)}</b><span>سعرة</span></div><div class="st"><b>${ar(s.m)}</b><span>دقائق</span></div><div class="st"><b>${LN[LI()]}</b><span>المستوى</span></div></div>
<div class="seg">${['easy','mid','hard'].map((k,i)=>`<button class="${Lv===k?'on':''}" onclick="setL('${k}')">${LN[i]}</button>`).join('')}</div>
${painUI()}<h2>التمارين (${ar(w.ids.length)})</h2>${w.ids.map((id,i)=>`<div class="ex" onclick="sheet([${w.ids}],${i})"><div class="th" data-i="${id}"></div><div><b>${X[id].n}</b><small>${ar(w.work)} ثانية</small></div></div>`).join('')}</div>
<div class="bar2"><button class="btn" style="margin:0" onclick="startW()">ابدئي</button></div>`;thumbs()}
const setL=l=>{S.lv=l;sv();render()};
/* exercise sheet */
let SH=null;
const sheet=(ids,i,tab)=>{SH={ids,i,tab:tab||0};drawSheet()};
function drawSheet(){const{ids,i,tab}=SH,x=X[ids[i]],s=$('#sheet');s.className='show';
s.innerHTML=`<div class="in"><i class="grab"></i><h2 style="margin:0">${x.n}</h2><div class="seg"><button class="${tab?'':'on'}" onclick="SH.tab=0;drawSheet()">فيديو</button><button class="${tab?'on':''}" onclick="SH.tab=1;drawSheet()">العضلات</button></div>${tab?`<h3>منطقة التركيز</h3><div class="chips">${x.m.map(m=>`<span>${m}</span>`).join('')}</div>${bd(x.m)}${PN[ids[i]].length?`<p class="note">يضغط على: ${PN[ids[i]].map(pn).join('، ')}</p>`:''}`:'<div class="stage" id="stg"></div>'}<h3>التعليمات</h3><p>${x.t}</p></div>
<div class="sf"><button onclick="navS(-1)" aria-label="السابق">›</button><b>${ar(i+1)}/${ar(ids.length)}</b><button onclick="navS(1)" aria-label="التالي">‹</button><button class="btn" onclick="closeS()">إغلاق</button></div>`;
if(!tab)mount($('#stg'),x)}
const navS=d=>{SH.i=(SH.i+d+SH.ids.length)%SH.ids.length;drawSheet()};
const closeS=()=>{$('#sheet').className='';$('#sheet').innerHTML=''};
/* player */
let P=null,tm=null;
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}};
let AC=null,WL=null;
function snd(f,d,ty,v,w,m){if((m?S.nomu:S.mute)||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(w||0);o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const FX={tick:n=>snd(700+(4-(n||3))*130,.12,'sine',.25),go:()=>{snd(660,.14,'triangle',.3);snd(990,.32,'triangle',.3,.14)},rest:()=>{snd(660,.2,'sine',.25);snd(440,.4,'sine',.25,.2)},half:()=>snd(780,.18,'sine',.22),tap:()=>snd(520,.05,'sine',.12),ok:()=>{snd(660,.1,'triangle',.25);snd(880,.18,'triangle',.25,.1)},hello:()=>[392,523,659,784,1047].forEach((f,i)=>snd(f,.5,'triangle',.28,i*.12)),done:()=>[523,659,784,1047].forEach((f,i)=>snd(f,.4,'triangle',.3,i*.16))};
const initA=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}};
addEventListener('pointerdown',initA);
let MU=null;
function music(on){clearInterval(MU);MU=null;if(!on||!AC)return;let k=0;const CH=[[220,262,330],[175,220,262],[196,262,330],[196,247,294]];
MU=setInterval(()=>{if(!P||P.pa||P.i>=P.seq.length)return;const c=CH[(k>>3)%4],r=P.seq[P.i].r;
if(k%8===0)c.forEach(f=>snd(f,4,'triangle',.04,0,1));
if(!r||k%2===0)snd(c[[0,1,2,1,2,1,0,2][k%8]]*2,.9,'sine',.05,0,1);k++},500)}
function togM(){S.nomu=!S.nomu;sv();music(!S.nomu);$('#mb').innerHTML=MI()}
function hurt(){P.pa=true;upd();const s=$('#sheet');s.className='show';s.innerHTML=`<div class='in'><i class='grab'></i><h2 style='margin:0'>وين يألمك؟</h2><p class='mu'>اختاري المكان ونبدل بقية التمارين.</p><div class='chips'>${PA.map(a=>`<button class='pc' onclick="hurtSet('${a[0]}')">${a[1]}</button>`).join('')}</div><button class='btn' onclick='closeS();P.pa=false;upd()'>لا شيء، كملي</button></div>`}
function hurtSet(k){if(!S.pain.includes(k))S.pain.push(k);sv();closeS();const rem=P.seq.slice(P.i).filter(x=>x.r===0).map(x=>x.id).filter(okx);if(!rem.length){finish();return}
P.seq=P.seq.slice(0,P.i);P.seq.push({r:1,id:rem[0],d:P.w.rest});rem.forEach((id,j)=>{P.seq.push({r:0,id,d:P.w.work});if(j<rem.length-1)P.seq.push({r:1,id:rem[j+1],d:P.w.rest})});P.left=P.seq[P.i].d;P.pa=false;FX.rest();drawP()}
document.addEventListener('click',e=>{if(e.target.closest('button,.day,.lc,.ex'))FX.tap()});
function enter(){initA();FX.hello();const e=$('#intro');e.classList.add('out');setTimeout(()=>e.remove(),600)}
const phaseFx=r=>r?FX.rest():FX.go();
const rel=()=>{try{WL&&WL.release();WL=null}catch(e){}};
function startW(){const w=V.f();P={w,seq:[{r:2,id:w.ids[0],d:10}],i:0,pa:false};
w.ids.forEach((id,k)=>{P.seq.push({r:0,id,d:w.work});if(k<w.ids.length-1)P.seq.push({r:1,id:w.ids[k+1],d:w.rest})});
P.left=P.seq[0].d;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
try{navigator.wakeLock.request('screen').then(l=>WL=l).catch(()=>{})}catch(e){}
V={v:'play',back:V.back,f:V.f};render();FX.rest();music(!S.nomu);clearInterval(tm);tm=setInterval(tick,1000)}
function rPlay(){drawP()}
function drawP(){const s=P.seq[P.i],x=X[s.id],pr=Math.round(P.i/P.seq.length*100);
const top=`<div class="ptop"><button id="mb" onclick="togM()" aria-label="الموسيقى">${MI()}</button><button id="sb" onclick="togS()" aria-label="الصوت">${SP()}</button><div class="pb"><i style="width:${pr}%"></i></div></div>`;
const ctl=`<div class="ctl"><button id="tp" onclick="togP()">إيقاف مؤقت</button><button onclick="nxt()">${s.r?'تخطي':'التالي'}</button><button onclick="hurt()">يؤلمني</button><button onclick="stopW()">إنهاء</button></div>`;
$('#app').innerHTML=s.r?`<div class="wrap pl rs">${top}<span class="badge rs">${s.r===2?'استعدي':'استراحة'}</span><div class="orb"><b id="tn"></b></div><p class="mu">التمرين القادم</p><h1>${x.n}</h1><p class="mu">${s.r===2?'جهزي مكانك وخذي نفس عميق.':'خذي نفس عميق واشربي رشفة ماء.'}</p>${ctl}</div>`:`<div class="wrap pl">${top}<span class="badge">تمرين</span><h1>${x.n}</h1><div class="stage" id="pst"></div><div class="tnum" id="tn"></div><p class="mu" style="min-height:56px">${x.t}</p>${ctl}</div>`;
if(!s.r)mount($('#pst'),x);upd()}
function upd(){$('#tn').textContent=ar(P.left);$('#tp').textContent=P.pa?'متابعة':'إيقاف مؤقت'}
const togP=()=>{P.pa=!P.pa;upd()};
const togS=()=>{S.mute=!S.mute;sv();$('#sb').innerHTML=SP()};
function tick(){if(P.pa)return;P.left--;if(P.left<=0){nxt();return}const s=P.seq[P.i];if(P.left<=3)FX.tick(P.left);else if(!s.r&&P.left===s.d>>1)FX.half();upd()}
function nxt(){P.i++;buzz();if(P.i>=P.seq.length){finish();return}P.left=P.seq[P.i].d;phaseFx(P.seq[P.i].r);drawP()}
function stopW(){clearInterval(tm);rel();music(0);go(V.back||'plan')}
function finish(){clearInterval(tm);music(0);FX.done();rel();const k=key();if(!S.done.includes(k))S.done.push(k);if(P.w.plan===S.day+1&&S.day<30)S.day++;sv();V={v:'done',w:P.w};render()}
function rDone(a){const s=stats(V.w);a.innerHTML=`<div class="wrap" style="text-align:center"><div style="width:110px;margin:40px auto 0">${CHK}</div><h1>أحسنتِ!</h1><p class="mu">خلصتي تمرين اليوم، جسمك يشكرك.</p><div class="grid3"><div class="st"><b>${ar(s.k)}</b><span>سعرة</span></div><div class="st"><b>${ar(s.m)}</b><span>دقائق</span></div><div class="st"><b>${ar(streak())}</b><span>أيام متتالية</span></div></div>${strk()}<button class="btn" onclick="go('plan')">رجوع للخطة</button></div>`}
/* profile */
function rMe(a){const w=S.w,l=w.length?w[w.length-1].v:null;let ch='';
if(w.length>1){const vs=w.map(o=>o.v),mn=Math.min(...vs)-1,mx=Math.max(...vs)+1;ch=`<svg viewBox="0 0 300 80" style="width:100%;margin-top:10px"><polyline points="${vs.map((v,i)=>(10+i*280/(vs.length-1))+','+(70-(v-mn)/(mx-mn)*60)).join(' ')}" fill="none" stroke="#ff4f8b" stroke-width="3" stroke-linejoin="round"/></svg>`}
a.innerHTML=`<div class="wrap"><h1>أنا</h1>${strk()}<div class="grid3"><div class="st"><b>${ar(S.done.length)}</b><span>جلسات</span></div><div class="st"><b>${ar(streak())}</b><span>ستريك</span></div><div class="st"><b>${l?ar(l):'—'}</b><span>كجم</span></div></div>
<div class="card"><h2 style="margin-top:0">تتبع الوزن</h2><div class="row"><input id="lw" type="number" inputmode="decimal" placeholder="وزنك اليوم"><button class="btn sm" onclick="logW()">حفظ</button></div>${ch}<p class="mu" style="margin-top:8px">${w.length>1?(w[0].v>l?'نزلتي '+ar((w[0].v-l).toFixed(1))+' كجم، ما شاء الله ':'نكمل، الثبات هو السر '):'سجلي وزنك كل أسبوع وشوفي تقدمك.'}</p></div>
${painUI()}<div class="card"><h2 style="margin-top:0">بياناتي</h2>${form()}</div><p class="ded2">مهداة إلى أمي الجميلة${HRS}</p></div>`}
function logW(){const v=parseFloat($('#lw').value);if(!(v>=30&&v<=250))return;S.w.push({d:key(),v});if(S.p)S.p.w=v;sv();FX.ok();render()}
render();requestAnimationFrame(loop);
</script>
</body>
</html>
