<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one phone column, dark plum ground, rose+apricot accent; water blue and walk green as semantic colors */
:root{
  --bg:#0c0a0d;--s1:#19151b;--s2:#251f28;--s3:#30293a;--line:#2f2833;
  --tx:#fbf5f8;--mu:#aa9ea8;--ac:#ff4f8b;--ac2:#ff8a3d;--acd:#4a1630;
  --wa:#4aa8ff;--wad:#12304d;--wk:#5fd38d;--wkd:#123a24;--warn:#ffc46b;--bad:#ff7a7a;--rest:#4f86ef;
  --f-d:"Reem Kufi","Tajawal",Tahoma,sans-serif;--f-b:"Tajawal",Tahoma,"Segoe UI",sans-serif;
  --r:22px;color-scheme:dark;
}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:500 17px/1.6 var(--f-b);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:540px;margin:0 auto;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{text-wrap:balance}
h1{font:700 29px/1.25 var(--f-d);margin:0}
h2{font:700 20px/1.35 var(--f-b);margin:0}
h3{font:700 16px/1.4 var(--f-b);color:var(--ac);margin:0}
p{margin:0}.mu{color:var(--mu)}small{display:block;font-size:14px;color:var(--mu)}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:700;color:var(--tx);cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:2px}
button:active{transform:scale(.97)}
.card{background:var(--s1);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--s1);border-radius:18px;padding:14px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1;min-width:0}
.btn{display:block;width:100%;min-height:56px;border-radius:18px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-size:19px}
.btn.sm{width:auto;min-height:48px;padding:0 20px;font-size:17px}
.btn.ghost{background:var(--s2)}
.btn.dang{background:#5a1b24;color:#ffd9de}
.btn.green{background:linear-gradient(90deg,#2fb36b,#5fd38d);color:#0b2416}
.chip{background:var(--s2);border-radius:99px;padding:6px 16px;min-height:44px;display:inline-flex;align-items:center;gap:6px;border:2px solid transparent}
.chip.on{border-color:var(--ac);background:var(--acd)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;background:var(--s2);border-radius:99px;padding:2px 12px;font-size:14px;color:var(--mu)}
.seg{display:flex;gap:4px;background:var(--s1);padding:5px;border-radius:16px}
.seg button{flex:1;min-height:44px;border-radius:12px;color:var(--mu);font-size:15px;padding:0 4px;line-height:1.3}
.seg button.on{background:var(--ac);color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.st{background:var(--s1);border-radius:18px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-width:0}
.st b{font:700 22px/1.3 var(--f-d);font-variant-numeric:tabular-nums}.st span{color:var(--mu);font-size:13px;line-height:1.35}
.st.in{background:var(--s2)}
.note{color:var(--warn);font-size:15px}.err{color:var(--bad);font-size:15px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:14px;color:var(--mu);display:block}
input,textarea{display:block;width:100%;font:inherit;font-size:19px;color:var(--tx);background:var(--s2);border:2px solid transparent;border-radius:14px;padding:8px 12px;min-height:50px;margin-top:3px}
input:focus,textarea:focus{border-color:var(--ac);outline:0}
textarea{font-size:16px;line-height:1.7;min-height:220px;resize:vertical}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back,.ib{background:var(--s1);border-radius:50%;width:46px;height:46px;display:grid;place-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--s1);border-radius:99px;padding:4px 12px;font-weight:700;flex:none}
.chev{color:var(--mu);flex:none}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:4;background:rgba(14,12,15,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav button{flex:1;color:var(--mu);font-size:13px;line-height:1.3;padding:4px 0;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--ac)}
nav svg{width:25px;height:25px}

/* home */
.alert{background:linear-gradient(135deg,#6b2a0f,#3a1a12);border:1px solid #a4501f;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center}
.alert.lost{background:var(--s1);border-color:var(--line)}
.alert>span{flex:none}
.msg{background:linear-gradient(140deg,#5a1a3a,#2a1430 60%,#1d1420);border-radius:26px;padding:18px;position:relative;overflow:hidden}
.msg .q{font:700 21px/1.6 var(--f-b);margin:6px 0 10px;position:relative}
.msg .from{color:#ffb3cd;font-weight:700;display:flex;align-items:center;gap:6px;position:relative}
.msg .hz{position:absolute;inset-inline-start:-18px;bottom:-24px;width:120px;opacity:.13}
.today{background:linear-gradient(135deg,var(--ac2),var(--ac));border-radius:26px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:8px}
.today h2{font:700 25px/1.3 var(--f-d)}
.wbtn{min-height:52px;border-radius:16px;background:#fff;color:#d8326c;font-size:19px;width:100%}
.today small{color:#ffe9f0}
.today.ok{background:linear-gradient(135deg,#1d5a3c,#16402c)}.today.ok .wbtn{color:#1d6b45}
.today.wl{background:linear-gradient(135deg,#1c6b45,#2fb36b)}.today.wl .wbtn{color:#1d6b45}
.glasses{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px}
.glass{height:42px;display:grid;place-items:center}
.glass svg{width:26px;height:38px}
.wbar{height:14px;border-radius:9px;background:var(--wad);overflow:hidden}.wbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#2f86e8,#8fd0ff);transition:width .3s}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 28px/1 var(--f-d)}
.ring b small{font:500 12px/1.2 var(--f-b);margin-top:4px}
.qb{background:var(--s2);border-radius:12px;min-height:44px;padding:0 12px;font-size:15px}
.qb.wa{background:var(--wad);color:#cfe8ff;line-height:1.25;padding:6px}
.qb.wa small{color:#9cc9f0;font-size:12px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini div{background:var(--s2);border-radius:14px;padding:8px 4px;text-align:center}
.mini b{display:block;font:700 18px/1.3 var(--f-d);font-variant-numeric:tabular-nums}
.mini span{font-size:12px;color:var(--mu)}
.sess{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.sess .x{width:36px;height:36px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--mu);flex:none}
.tip{display:flex;gap:12px;align-items:flex-start;flex-direction:row;width:100%;text-align:start}
.tip>span{flex:none}

/* streak */
.strk{border-radius:26px;padding:18px;text-align:center;background:radial-gradient(circle at 50% 0,#5a2a16,var(--s1) 72%);display:flex;flex-direction:column;align-items:center;gap:2px}
.strk .nm{font:700 62px/1 var(--f-d);background:linear-gradient(#ffd37a,#ff5e3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.strk.off{background:var(--s1)}.strk.off .nm{background:none;color:var(--mu)}
.fb{width:66px;height:84px;transform-origin:50% 100%;animation:fk 1.1s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(255,122,41,.7))}
.strk.off .fb{animation:none;filter:grayscale(1);opacity:.5}
.strk.risk .fb{animation-duration:.45s;filter:drop-shadow(0 0 16px rgba(255,180,60,.9))}
.wk{display:flex;gap:6px;margin-top:10px;width:100%}
.wk div{flex:1;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px}
.wk b{display:grid;place-items:center;width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;background:var(--s2);color:var(--tx);font-size:14px}
.wk .d b{background:linear-gradient(135deg,var(--ac2),var(--ac))}.wk .cv b{background:#2f5fa8;color:#fff}.dots7 i.cv{background:#4a86d8}.svs{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}.svs span{color:var(--s3);display:grid}.svs span.on{color:#6aa8ff}.svs small{width:100%;text-align:center}.wk .t b{box-shadow:0 0 0 2px #fff}
@keyframes fk{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.95,1.07) skewX(2deg)}60%{transform:scale(1.04,.96) skewX(-2deg)}}

/* plan */
.hero{border-radius:26px;padding:20px;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;display:flex;flex-direction:column;gap:6px}
.hero h2{font:700 27px/1.3 var(--f-d)}.hero small{color:#ffe9f0}
.hero.walk{background:linear-gradient(135deg,#1c6b45,#2fb36b)}.hero.chair{background:linear-gradient(135deg,#5b3fc4,#9b6bff)}
.hero .wbtn{margin-top:8px}.hero.walk .wbtn{color:#1d6b45}.hero.chair .wbtn{color:#5b3fc4}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.pt{display:flex;flex-direction:column;gap:8px}
.ptb{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:var(--s1);border-radius:18px;padding:12px 14px;border:2px solid transparent}
.ptb.on{border-color:var(--ac)}
.ptb .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.days{display:flex;flex-direction:column;gap:8px}
.day{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--s1);border-radius:18px;padding:12px 14px}
.day .dot{width:30px;height:30px;border-radius:50%;background:var(--s2);flex:none;display:grid;place-items:center;font:700 14px var(--f-d);color:var(--mu)}
.day.dn .dot{background:var(--ac);color:#fff}
.day.cu{background:#fff;color:#18121a}.day.cu small{color:#6a5d66}.day.cu .dot{background:var(--ac);color:#fff;box-shadow:0 0 0 5px rgba(255,79,139,.3)}
.day.rs .dot{background:var(--wad);color:var(--wa)}

/* lists */
.ex{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.ex:last-child{border-bottom:0}
.th{width:80px;height:80px;border-radius:16px;background:radial-gradient(circle at 50% 35%,#2e2235,#141116 80%);flex:none;overflow:hidden}
.th svg{width:100%;height:100%}
.lc{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:start;background:var(--s1);border-radius:20px;padding:16px}
.lvdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}

/* sheets */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:6;display:flex;flex-direction:column}
#sheet .in{margin-top:auto;background:var(--s1);border-radius:26px 26px 0 0;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:84vh;overflow:auto;display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px;margin-inline:auto}
#sheet .in.nb{padding-bottom:16px}
.grab{display:block;width:44px;height:5px;border-radius:9px;background:#5a5160;margin:0 auto}
.sf{background:var(--s1);display:flex;align-items:center;gap:10px;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));width:100%;max-width:560px;margin-inline:auto;border-top:1px solid var(--line)}
.sf .nb{width:46px;height:46px;border-radius:50%;background:var(--s2);display:grid;place-items:center;flex:none}
.sf .btn{flex:1}
.stage{background:radial-gradient(circle at 50% 35%,#3a2640,#141116 75%);border-radius:22px;aspect-ratio:200/168;width:100%;max-width:100%}
.stage svg{width:100%;height:100%}
.steps{margin:0;padding-inline-start:26px;list-style:arabic-indic;display:flex;flex-direction:column;gap:6px}
.easy{background:var(--wkd);color:#bff0d3;border-radius:14px;padding:10px 12px;font-size:15px}

/* player */
.pl{text-align:center;align-items:stretch}
.ptop{display:flex;align-items:center;gap:8px}
.ptop .ib{background:var(--s2);width:44px;height:44px}
.ptop .ib.off{opacity:.45}
.pb{flex:1;height:8px;background:var(--s2);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac);transition:width .4s}
.rs .pb i{background:var(--rest)}
.badge{align-self:center;display:inline-block;padding:2px 18px;border-radius:99px;background:var(--ac);font-weight:700}
.badge.rs{background:var(--rest)}
.tnum{font:700 80px/1.1 var(--f-d);font-variant-numeric:tabular-nums}
.tbar{height:6px;background:var(--s2);border-radius:9px;overflow:hidden}.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .25s linear}
.orb{width:210px;height:210px;margin:16px auto 10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6ea2ff,#1d3f8f);display:grid;place-items:center;animation:br 4s ease-in-out infinite;box-shadow:0 0 60px rgba(79,134,239,.35)}
.orb b{font:700 78px/1 var(--f-d)}
@keyframes br{50%{transform:scale(1.08)}}
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ctl button{min-height:56px;border-radius:16px;background:var(--s2);font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ctl svg{width:22px;height:22px}
.paused{color:var(--warn);font-weight:700}

/* walk */
.wtime{font:700 58px/1.1 var(--f-d);font-variant-numeric:tabular-nums;text-align:center;direction:ltr;unicode-bidi:isolate}
#wkt{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wring{position:relative;width:min(240px,70vw);aspect-ratio:1;margin:6px auto}
.wring>svg{width:100%;height:100%;transform:rotate(-90deg)}
.wring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.walker{color:var(--wk);display:block}
.walker.go{animation:wb 1s ease-in-out infinite}
@keyframes wb{50%{transform:translateY(-4px)}}

/* food */
.plate{display:flex;align-items:center;gap:14px}
.plate svg{width:150px;height:150px;flex:none}
.leg{display:flex;flex-direction:column;gap:8px;font-size:15px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:8px;vertical-align:middle}
.ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ul li{display:flex;gap:10px;align-items:flex-start}
.ul li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-top:10px}
.swap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.swap .a{color:var(--mu);text-decoration:line-through;text-decoration-color:rgba(255,122,122,.6)}
.swap .b{color:#c9f5da;font-weight:700}
.meal{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.kc{flex:none;background:var(--s2);border-radius:10px;padding:2px 10px;font-size:14px;color:var(--warn);font-variant-numeric:tabular-nums;white-space:nowrap}
.shop{display:flex;align-items:center;gap:12px;padding:8px 0;width:100%;text-align:start;border-bottom:1px solid var(--line)}
.shop .bx{width:28px;height:28px;border-radius:8px;border:2px solid #5a5160;display:grid;place-items:center;flex:none}
.shop.on .bx{background:var(--wk);border-color:var(--wk);color:#0b2416}
.shop.on span{color:var(--mu);text-decoration:line-through}
.dsel{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.dsel::-webkit-scrollbar{display:none}
.dsel button{flex:none;min-width:58px;min-height:58px;border-radius:14px;background:var(--s1);color:var(--mu);font-size:13px;line-height:1.3;padding:4px 6px}
.dsel button b{display:block;font:700 17px var(--f-d);color:var(--tx)}
.dsel button.on{background:var(--ac);color:#fff}.dsel button.on b{color:#fff}

/* stats */
.chart{width:100%;height:auto;display:block}
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.md{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:13px;line-height:1.35}
.md svg{width:72px;height:84px}
.md.lock{opacity:.45}
.md b{font-size:14px}
.mdw{width:44px;display:block}.mdw svg,.mdl svg{width:100%;height:100%;display:block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center;font-size:12px;color:var(--mu)}
.cal i{font-style:normal;aspect-ratio:1;border-radius:10px;background:var(--s2);display:grid;place-items:center;color:var(--tx);font-size:13px;font-family:var(--f-d)}
.cal i.w{background:linear-gradient(135deg,var(--ac2),var(--ac))}
.cal i.k{background:#1f5a3a}
.cal i.t{box-shadow:0 0 0 2px #fff inset}
.cal i.e{background:none}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mu)}
.lgd span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;background:var(--c)}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.exst{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.exst .bg{height:8px;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2));margin-top:4px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;text-align:start}
.sw{width:52px;height:30px;border-radius:99px;background:var(--s3);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.tg[aria-pressed="true"] .sw{background:var(--ac)}
.tg[aria-pressed="true"] .sw::after{inset-inline-start:25px}
details{background:var(--s1);border-radius:var(--r);padding:4px 16px}
details[open]{padding-bottom:16px}
summary{cursor:pointer;min-height:52px;display:flex;align-items:center;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-inline-start:auto;width:10px;height:10px;border-inline-end:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
details>div{display:flex;flex-direction:column;gap:10px}
.clip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.clip .qb{display:inline-flex;align-items:center;gap:4px}
.clip .rec{background:#7a1d2c;color:#ffd9de}
.clip .rec.on{background:#ff4f5f;color:#fff;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.6}}

 for(let d=ds[0];d<today;d++){if(has.has(d)){run++;miss=0;best=Math.max(best,run);continue}
  if(!run)continue;miss++;if(miss===1)continue;const m=mOf(d);
  if((used[m]||0)<SAVES){used[m]=(used[m]||0)+1;cov.add(kOf(d))}else{prev=run;run=0;miss=0}}

let VOS=[];
function voices(){try{VOS=(speechSynthesis.getVoices()||[]).filter(v=>/^ar/i.test(v.lang))}catch(e){VOS=[]}return VOS}

const isMale=v=>!!(v&&MALE.test(v.name)&&!FEM.test(v.name));

function addWalk(m,p,src,steps,quiet){const k=key(),o=lg(k),e=walkEst(m,p);if(steps){e.st=steps;e.km=r2(steps*stride('n')/1000)}

 const g=S.prog.walk;let msg='سجلنا '+MD(m)+' مشي';if(S.plan==='walk'&&g.day<30){const d=g.day+1,w=dayWk(d,'walk');if(w.walk&&o.wk>=w.tgt&&!Object.values(g.pd).includes(k)){g.day=d;g.pd[d]=k;if(!S.act.includes(k))S.act.push(k);msg='خلصتي يوم '+ar(d)+' من خطة المشي!'}}

/* ---------- real step counter (motion sensor) ---------- */
const PED={on:0,g:null,f:0,up:0,last:0,ev:0,chk:null};
const pedAvail=()=>typeof window.DeviceMotionEvent!=='undefined';
function pedSteps(){const w=S.ws;if(!w)return 0;let hid=w.hid||0;if(w.hs0&&w.st)hid+=Date.now()-Math.max(w.hs0,w.st);return Math.round((w.stp||0)+spm(w.p)*hid/60000)}
function onMotion(e){const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;PED.ev=Date.now();const w=S.ws;if(!w||!w.st||!w.sn)return;
 const m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z),now=Date.now();PED.g=PED.g==null?m:PED.g*.92+m*.08;PED.f=PED.f*.55+(m-PED.g)*.45;
 if(!PED.up&&PED.f>1.15&&now-PED.last>300){PED.up=1;PED.last=now;w.stp=(w.stp||0)+1;if(w.stp%10===0)sv()}else if(PED.up&&PED.f<.25)PED.up=0}
function pedAttach(){if(PED.on)return;addEventListener('devicemotion',onMotion);PED.on=1;PED.g=null;PED.ev=0;const w=S.ws;if(w){w.sn=1;sv()}
 clearTimeout(PED.chk);PED.chk=setTimeout(()=>{if(PED.on&&!PED.ev){pedOff(1);toast('الحساس ما أرسل قراءات هنا. يشتغل من رابط التطبيق في سفاري على الجوال');render(true)}},3000);render(true)}
function pedOn(quiet){if(!pedAvail()){if(!quiet)toast('جهازك أو المتصفح ما فيه حساس حركة');return}
 try{if(typeof DeviceMotionEvent.requestPermission==='function'){DeviceMotionEvent.requestPermission().then(r=>{if(r==='granted')pedAttach();else{toast('ما انسمح للتطبيق بالحركة. تقدرين تسمحين من إعدادات سفاري');S.ped=false;sv();render(true)}}).catch(()=>{toast('الحساس غير متاح هنا، يشتغل من رابط التطبيق في سفاري');render(true)})}else pedAttach()}catch(e){toast('الحساس غير متاح هنا')}}
function pedOff(keep){removeEventListener('devicemotion',onMotion);PED.on=0;clearTimeout(PED.chk);if(keep&&S.ws){S.ws.sn=0;sv()}}
function pedTg(){S.ped=!S.ped;sv();const w=S.ws;if(w){if(S.ped)pedOn();else{w.stp=pedSteps();w.sn=0;w.hid=0;w.hs0=null;pedOff();sv();render(true)}}else render(true)}
function pedUI(){const w=S.ws,on=w?!!(w.sn&&PED.on):S.ped,need=w&&w.sn&&!PED.on;
 return `<button type="button" class="tg" style="background:var(--s1);border-radius:16px;padding:8px 14px" aria-pressed="${w?!!w.sn:S.ped}" onclick="${need?'pedOn()':'pedTg()'}"><span class="row"><span style="color:var(--wk)">${SV(IC.walk,24)}</span><span style="text-align:start"><b>${need?'شغلي الحساس من جديد':'عد الخطوات بحساس الجوال'}</b><small>${need?'انقطع الحساس بعد ما سكرتي الصفحة، اضغطي هنا':on?'شغال: كل خطوة تنحسب فعليًا':'خلي الجوال معك والشاشة شغالة'}</small></span></span><span class="sw"></span></button>`}

function icsMake(){const r=S.rem,on=r.on,L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//tamarin-mama//ar','CALSCALE:GREGORIAN','METHOD:PUBLISH'],d=new Date(),ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'),st=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';let n=0;
 const ev=(title,t,desc)=>{const[h,m]=t.split(':');n++;L.push('BEGIN:VEVENT','UID:mama-'+n+'-'+ymd+'@tamarin','DTSTAMP:'+st,'DTSTART:'+ymd+'T'+h.padStart(2,'0')+m+'00','DURATION:PT10M','RRULE:FREQ=DAILY','SUMMARY:'+title,'DESCRIPTION:'+desc,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+title,'TRIGGER:PT0M','END:VALARM','END:VEVENT')};
 if(on.wk)ev('وقت المشي يا '+momName(),r.wk,'افتحي تمارين ماما وابدئي المشي');if(on.ex)ev('وقت التمرين يا '+momName(),r.ex,'تمرين اليوم ينتظرك');
 if(on.wa)['10:00','13:00','16:00','19:00'].forEach(t=>ev('اشربي كوب ماء',t,'سجليه في التطبيق'));if(on.sl)ev('وقت التنفس والنوم',r.sl,'تمرين تنفس ٥ دقائق قبل النوم');
 if(on.md)doses().forEach(x=>ev('دواء: '+x.m.n,x.t,x.m.ds||''));L.push('END:VCALENDAR');return{txt:L.join('\r\n'),n}}
function remGet(){const r=S.rem;['ex','wk','sl'].forEach(k=>{const e=$('#rm_'+k);if(e&&okT(e.value))r[k]=e.value});['ex','wk','wa','sl','md'].forEach(k=>{const e=$('#rc_'+k);if(e)r.on[k]=e.checked?1:0});sv()}
function remExport(){remGet();if(!hosted()&&location.protocol!=='file:'){toast('التذكيرات تنضاف من رابط التطبيق الخاص في سفاري (GitHub)');return}const m=icsMake();if(!m.n){toast('اختاري تذكير واحد على الأقل');return}const b=new Blob([m.txt],{type:'text/calendar;charset=utf-8'});
 if(dlBlob(b,'tadhkeerat-mama.ics'))toast('افتحي الملف واضغطي «إضافة الكل»');else toast('ما قدرنا ننزل الملف هنا')}

  ${CLIPS.map(c=>{const has=HASCLIP[c[0]],rec=REC&&REC.k===c[0];return `<div class="clip"><div class="sp" style="min-width:150px"><b>${c[1]}</b><small>${has?'فيه تسجيل':'ما فيه تسجيل'}</small></div><button type="button" class="qb rec ${rec?'on':''}" onclick="V.so='son';recClip('${c[0]}')">${SV(IC.mic,18)} ${rec?'وقف':'سجل'}</button><label class="qb" style="display:inline-flex;align-items:center;gap:4px;color:var(--tx);cursor:pointer;margin:0">${SV(IC.upload,18)} ملف<input type="file" accept="audio/*" hidden onchange="V.so='son';upClip('${c[0]}',this)"></label>${has?`<button type="button" class="qb" aria-label="اسمع" onclick="playClip('${c[0]}')">${SV(IC.playI,16)}</button><button type="button" class="qb" aria-label="امسح" onclick="V.so='son';clipDel('${c[0]}').then(()=>render(true))">${SV(IC.trash,16)}</button>`:''}</div>`}).join('')}
  <small>لو «سجل» ما اشتغل: سجل في «مذكرات صوتية» واحفظه في «الملفات»، ثم اضغط «ملف».</small></div></details>
 <details${V.so==='hl'?' open':''}><summary>ربط الخطوات بتطبيق الصحة</summary><div><p class="mu">الآيفون يعد خطواتك طول اليوم في تطبيق «الصحة». الاختصار يجيبها هنا كل ما تفتحين التطبيق.</p>
  ${hosted()?`<label for="hlUrl">رابط الاختصار<input id="hlUrl" type="text" readonly value="${esc(appURL())}#steps-" style="direction:ltr;font-size:14px"></label><button type="button" class="btn sm ghost" onclick="copyTxt($('#hlUrl').value,$('#hlUrl'))">انسخي الرابط</button>`:`<p class="note">يشتغل بس لما يكون التطبيق على رابطك الخاص (GitHub Pages) ومفتوح في سفاري.</p>`}
  <ol class="steps"><li>افتحي «الاختصارات» واضغطي +.</li><li>أضيفي «البحث عن عينات الصحة» (Find Health Samples): النوع «الخطوات»، تاريخ البدء «اليوم».</li><li>أضيفي «حساب الإحصائيات» (Calculate Statistics): «المجموع»، ثم «تقريب الرقم» (Round Number).</li><li>أضيفي «نص» (Text) والصقي الرابط، وبعد ‎#steps-‎ حطي «الرقم المقرّب».</li><li>أضيفي «فتح عناوين URL» (Open URLs).</li><li>سميه «تمارين ماما» بأيقونة الصورة، ثم «إضافة إلى الشاشة الرئيسية».</li></ol><small>افتحي التطبيق دايم من هذا الاختصار.</small></div></details>
 <details${V.so==='bk'?' open':''}><summary>نسخة احتياطية</summary><div><p class="mu">لنقل التطبيق لجوال أو رابط ثاني. الصور والتسجيلات ما تنتقل.</p><button type="button" class="btn sm ghost" onclick="exportD()">انسخي كود بياناتي</button><textarea id="bkIn" placeholder="الصقي الكود هنا" style="min-height:100px;direction:ltr;font-size:13px"></textarea><button type="button" class="btn sm" onclick="importD()">استرجعي البيانات</button><p class="err" id="bkErr" role="alert"></p></div></details>
 <button type="button" class="btn dang" onclick="ask('تمسحين كل البيانات وتبدين من الصفر؟ ما تقدرين ترجعينها.','امسحي كل شيء',wipe,true)">امسحي كل البيانات</button>
 <p class="ded2">مهداة إلى أمي الجميلة ${esc(momName())} ${HRT(20)}</p></div>`;
 a.querySelectorAll('[id^=rm_],[id^=rc_]').forEach(e=>e.addEventListener('change',remGet))}
function saveSon(){S.mom=$('#momIn').value.trim().slice(0,24)||'زينة';S.son=$('#sonIn').value.trim().slice(0,24)||'حاتم';const L=$('#msgIn').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,200);S.msgs=L.length&&L.join('\n')!==MSGS.join('\n')?L:null;
 const R=$('#rwIn').value.split('\n').map(l=>{const m=l.split(/=|:/);if(m.length<2)return null;const p=num(m[m.length-1]),n=m.slice(0,-1).join('=').trim();return n&&p>0?{n:n.slice(0,50),p:Math.round(p)}:null}).filter(Boolean);if(R.length)S.rw=R.slice(0,10);
 Object.keys(SURPB).forEach(id=>{const e=$('#sp_'+id);if(e&&e.value.trim())S.surp[id]=e.value.trim().slice(0,500)});sv();FX.ok();toast('حفظنا');V.so='son';render(true)}
function resetMsgs(){S.msgs=null;sv();toast('رجعنا الرسائل الأصلية');V.so='son';render(true)}
function setVoice(i){const v=voices()[i];if(!v)return;S.vname=v.name;sv();say('أهلين يا '+momName()+'، أنا مدربتك',1);render(true)}
function tgSet(k){S[k]=!S[k];sv();if((k==='novo'&&!S.novo)||k==='vsoft')say('أهلين يا '+momName()+'، أنا مدربتك',1);V.so='snd';render(true)}

/* ---------- router ---------- */
const SUBS={water:rWater,breathe:rBreathe,health:rHealth,meds:rMeds,sleep:rSleep,photos:rPhotos,msgs:rMsgs,rewards:rRewards};
function render(keep){const y=scrollY;closeS();const views={home:rHome,plan:rPlan,lib:rLib,food:rFood,me:rMe,detail:rDet,play:rPlay,done:rDone,walk:rWalk,tips:rTips,set:rSet,...SUBS};
 if(V.v!=='breathe'&&BRT){BRT.on=0;clearTimeout(BRT.tm);BRT=null}
 $('#nav').hidden=!['home','plan','lib','food','me'].includes(V.v);
 try{(views[V.v]||rHome)($('#app'))}catch(err){console.error(err);V={v:'home',tab:'home'};rHome($('#app'))}
 document.querySelectorAll('#nav button').forEach(b=>{const on=b.dataset.v===V.tab;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false')});
 scrollTo(0,keep?y:0)}

/* ---------- offline (service worker, only on a real https host) ---------- */
try{if(hosted()){const l=document.createElement('link');l.rel='manifest';l.href='manifest.json';document.head.appendChild(l);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}}catch(e){}

/* ---------- start ---------- */
function enter(){initA();FX.hello();const e=$('#intro');e.classList.add('out');setTimeout(()=>e.remove(),550);if(HASCLIP.hello)setTimeout(()=>playClip('hello'),700);setTimeout(checkB,900)}
const HI0=importHealth();
$('#enterBtn').onclick=()=>{enter();if(HI0!=null)setTimeout(()=>{toast('جبنا خطواتك من تطبيق الصحة: '+fmtN(HI0));setTimeout(checkB,400)},700)};$('#introBy').textContent='من ولدها '+sonName();
if(S.ws)V={v:'walk',tab:'home',back:'home'};
render();requestAnimationFrame(loop);
</script>
